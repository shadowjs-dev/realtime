name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A repository, a failing test or exact steps. Smaller is faster.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `npm ls @shadow-js/core @shadow-js/web` and your Node.js version.
    validations:
      required: true
  - type: dropdown
    id: pm
    attributes:
      label: Package manager
      options: [npm, yarn, pnpm, bun]
